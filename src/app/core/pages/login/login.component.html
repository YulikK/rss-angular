<div class="flex flex-col items-center justify-center p-10">
  <form (ngSubmit)="onSubmit()" class="w-full max-w-sm flex flex-col justify-center items-center gap-2">
    <img src="img/user.png" alt="Like" class="w-[50px]" />
    <mat-form-field appearance="outline" class="my-input">
      <input matInput [(ngModel)]="userName" name="userName" placeholder="User" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="my-input">
      <input matInput [(ngModel)]="password" name="password" type="password" placeholder="password" />
    </mat-form-field>
    <div class="flex items-center justify-between">
      <button
        class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
        type="submit"
      >
        Sign In
      </button>
    </div>
  </form>
</div>
