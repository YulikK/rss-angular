@let currentMovie = movies$ | async | findById: id;

<main class="flex flex-col items-center">
  <section class="max-w-[900px]">
    <div class="w-full flex justify-end">
      <a [routerLink]="['/']" class="cursor-pointer p-2">
        <button mat-icon-button type="submit">
          <img class="w-[24px]" src="img/close.png" alt="Back home" />
        </button>
      </a>
    </div>

    @if (currentMovie) {
      <app-search-item
        [isDetailPage]="true"
        [movie]="currentMovie"
        (updateFeedback)="onUpdateFeedback($event)"
      ></app-search-item>
    } @else {
      <p class="text-center">No results found</p>
    }
  </section>
</main>
